# Análisis estático de LibreStock (Guía de Práctica N°03, Actividad 16)
#
# El repositorio contiene dos paquetes de Node.js: la API en server/ y la SPA en
# client/. Ambos se analizan; ninguno se excluye para mejorar las métricas.

sonar.projectKey=librestock-v1
sonar.projectName=LibreStock
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Código escrito por el equipo
sonar.sources=server,client/src

# Las pruebas se declaran como tales: no cuentan como código de producción para
# los code smells ni para la deuda técnica, pero sí se analizan como pruebas
sonar.tests=server/tests,client/tests

# Exclusiones. Cada una es código que el equipo no escribió o artefacto generado:
#   node_modules   dependencias de terceros
#   client/dist    salida de compilación de Vite
#   coverage       reportes de cobertura
#   cypress/videos y screenshots   evidencias que genera Cypress al ejecutar
#   server/tests y client/tests   declarados arriba como pruebas; fuentes y
#                                  pruebas no pueden solaparse
sonar.exclusions=**/node_modules/**,client/dist/**,**/coverage/**,client/cypress/videos/**,client/cypress/screenshots/**,server/tests/**,client/tests/**

# Cobertura en formato LCOV, generada antes de lanzar el análisis. Son tres
# reportes porque hay tres perfiles de pruebas:
#   server/coverage              Jest unitario: reglas puras del inventario y del pago
#   server/coverage-integration  Jest de integración: controladores, rutas y servicios
#   client/coverage              Vitest: cliente HTTP, sesión, guardián de rol y formatos
# La cobertura global del cliente es baja a propósito y no se maquilla: las diez
# pantallas de src/pages siguen sin pruebas porque les corresponden pruebas de
# extremo a extremo con Cypress, todavía pendientes. Los módulos con lógica
# verificable sí están cubiertos por completo.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,server/coverage-integration/lcov.info,client/coverage/lcov.info
