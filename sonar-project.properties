# Análisis estático de LibreStock (Guía de Práctica N°03, Actividad 16)
#
# El repositorio contiene dos paquetes de Node.js: la API en server/ y la SPA en
# client/. Ambos se analizan; ninguno se excluye para mejorar las métricas.

sonar.projectKey=librestock-v1
sonar.projectName=LibreStock
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Código escrito por el equipo
sonar.sources=server,client/src

# Las pruebas se declaran como tales: no cuentan como código de producción para
# los code smells ni para la deuda técnica, pero sí se analizan como pruebas
sonar.tests=server/tests

# Exclusiones. Cada una es código que el equipo no escribió o artefacto generado:
#   node_modules   dependencias de terceros
#   client/dist    salida de compilación de Vite
#   coverage       reportes de cobertura
#   cypress/videos y screenshots   evidencias que genera Cypress al ejecutar
#   server/tests   declarado arriba como pruebas; fuentes y pruebas no pueden solaparse
sonar.exclusions=**/node_modules/**,client/dist/**,**/coverage/**,client/cypress/videos/**,client/cypress/screenshots/**,server/tests/**

# Cobertura: la produce Jest en formato LCOV antes de lanzar el análisis.
# El cliente no tiene pruebas unitarias todavía, así que su cobertura será cero.
# Es un dato real y no debe ocultarse excluyendo client/src del análisis.
# Son dos perfiles de Jest y por tanto dos reportes: el unitario cubre las reglas
# puras y el de integración los controladores, rutas y servicios con base de datos.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,server/coverage-integration/lcov.info
